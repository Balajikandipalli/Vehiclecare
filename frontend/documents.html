<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vehicle Documents - VehicleCare</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .documents-page {
            min-height: 100vh;
            padding: 50px 8%;
            background: #f8fafc;
        }

        .documents-header {
            margin-bottom: 30px;
        }

        .documents-header h1 {
            font-size: 40px;
            margin: 8px 0;
        }

        .documents-header p {
            color: #64748b;
        }

        .document-grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 25px;
        }

        .document-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 25px;
        }

        .document-card h2 {
            margin-top: 0;
        }

        .document-card label {
            display: block;
            margin-top: 14px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .document-card input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }

        .document-status {
            display: inline-block;
            margin: 15px 0;
            padding: 7px 13px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 13px;
        }

        .document-valid {
            background: #dcfce7;
            color: #166534;
        }

        .document-due {
            background: #fef3c7;
            color: #92400e;
        }

        .document-overdue {
            background: #fee2e2;
            color: #b91c1c;
        }

        .document-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .document-message {
            min-height: 20px;
            margin-top: 12px;
        }

        .document-file {
            margin-top: 12px;
            color: #475569;
            font-size: 14px;
        }

        @media (max-width: 800px) {
            .document-grid {
                grid-template-columns: 1fr;
            }

            .documents-page {
                padding: 35px 5%;
            }
        }

    </style>

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🚗 VehicleCare
        </div>

        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="vehicles.html">
                My Vehicles
            </a>

            <button onclick="logout()">
                Logout
            </button>

        </div>

    </nav>


    <main class="documents-page">

        <div class="documents-header">

            <p class="tag">
                VEHICLE DOCUMENTS
            </p>

            <h1>
                🛡️ Insurance & PUC
            </h1>

            <p id="vehicleInfo">
                Loading vehicle...
            </p>

        </div>


        <div class="document-grid">


            <!-- INSURANCE -->

            <section class="document-card">

                <h2>
                    🛡️ Insurance
                </h2>

                <span
                    id="insuranceStatus"
                    class="document-status document-valid"
                >
                    Not Added
                </span>

                <form id="insuranceForm">

                    <label>
                        Policy Number
                    </label>

                    <input
                        type="text"
                        id="insuranceNumber"
                        placeholder="Policy number"
                    >

                    <label>
                        Insurance Provider
                    </label>

                    <input
                        type="text"
                        id="insuranceProvider"
                        placeholder="Provider name"
                    >

                    <label>
                        Issue Date
                    </label>

                    <input
                        type="date"
                        id="insuranceIssueDate"
                    >

                    <label>
                        Expiry Date *
                    </label>

                    <input
                        type="date"
                        id="insuranceExpiryDate"
                        required
                    >

                    <label>
                        Insurance Document
                    </label>

                    <input
                        type="file"
                        id="insuranceFile"
                        accept=".pdf,.png,.jpg,.jpeg"
                    >

                    <p
                        id="insuranceFileName"
                        class="document-file"
                    ></p>

                    <p
                        id="insuranceMessage"
                        class="document-message"
                    ></p>

                    <div class="document-actions">

                        <button
                            type="submit"
                            class="primary-btn"
                        >
                            Save Insurance
                        </button>

                        <button
                            type="button"
                            class="secondary-btn"
                            onclick="deleteDocument('INSURANCE')"
                        >
                            Delete
                        </button>

                    </div>

                </form>

            </section>


            <!-- PUC -->

            <section class="document-card">

                <h2>
                    📄 PUC
                </h2>

                <span
                    id="pucStatus"
                    class="document-status document-valid"
                >
                    Not Added
                </span>

                <form id="pucForm">

                    <label>
                        Certificate Number
                    </label>

                    <input
                        type="text"
                        id="pucNumber"
                        placeholder="PUC certificate number"
                    >

                    <label>
                        Issuing Center
                    </label>

                    <input
                        type="text"
                        id="pucProvider"
                        placeholder="PUC center"
                    >

                    <label>
                        Issue Date
                    </label>

                    <input
                        type="date"
                        id="pucIssueDate"
                    >

                    <label>
                        Expiry Date *
                    </label>

                    <input
                        type="date"
                        id="pucExpiryDate"
                        required
                    >

                    <label>
                        PUC Document
                    </label>

                    <input
                        type="file"
                        id="pucFile"
                        accept=".pdf,.png,.jpg,.jpeg"
                    >

                    <p
                        id="pucFileName"
                        class="document-file"
                    ></p>

                    <p
                        id="pucMessage"
                        class="document-message"
                    ></p>

                    <div class="document-actions">

                        <button
                            type="submit"
                            class="primary-btn"
                        >
                            Save PUC
                        </button>

                        <button
                            type="button"
                            class="secondary-btn"
                            onclick="deleteDocument('PUC')"
                        >
                            Delete
                        </button>

                    </div>

                </form>

            </section>

        </div>

    </main>


    <script src="js/documents.js"></script>

</body>

</html>
