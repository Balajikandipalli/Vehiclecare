<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - VehicleCare</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>🚗 VehicleCare</h1>
        <h2>Create Account</h2>
        <p>Start managing your vehicle maintenance.</p>

        <form id="registerForm">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="tel"
                id="phone"
                placeholder="Phone Number"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <p id="message"></p>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</div>

<script src="js/auth.js"></script>

</body>
</html>
